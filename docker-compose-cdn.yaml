services:
  local_cdn:
    image: nginx:1.27-alpine
    container_name: sellgar-local-cdn
    ports:
      - '8088:80'
    volumes:
      - ./infra/local-cdn/nginx.conf:/etc/nginx/nginx.conf:ro
      - local_cdn_cache:/var/cache/nginx
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  local_cdn_cache:
    driver: local
